# Oracle schema definition for connector integration tests
# All 13 tables: orgchart (3 tables) + directory (10 tables)

# ============================================
# ORGCHART SCHEMA
# ============================================

objectClasses:
  orgchart_type_ref:
    sql:
      table: ORGCHART_TYPE_REF
    attributes:
      TYPE_REF_ID:
        connId:
          name: __UID__
        sql:
          primaryKey: true
          type: NUMBER(10)
      TYPE_CODE:
        sql:
          type: VARCHAR2(20)
      DISPLAY_NAME:
        connId:
          name: __NAME__
        sql:
          type: VARCHAR2(255)

  orgchart_node:
    sql:
      table: ORGCHART_NODE
    attributes:
      UNIT_ID:
        connId:
          name: __UID__
        sql:
          primaryKey: true
          type: NUMBER(10)
      UNIT_CODE:
        connId:
          name: __NAME__
        sql:
          type: VARCHAR2(100)
      PARENT_UNIT_ID:
        sql:
          type: NUMBER(10)
      TYPE_REF_ID:
        sql:
          type: NUMBER(10)
      HIERARCHY_LEVEL:
        sql:
          type: NUMBER(3)
      DISPLAY_ORDER:
        sql:
          type: NUMBER(10)
      CREATED_DATE:
        sql:
          type: TIMESTAMP(6)
      UPDATED_DATE:
        sql:
          type: TIMESTAMP(6)

  orgchart_label:
    sql:
      table: ORGCHART_LABEL
    attributes:
      UNIT_ID:
        connId:
          name: __UID__
        sql:
          type: NUMBER(10)
      LANGUAGE:
        connId:
          name: __NAME__
        sql:
          type: VARCHAR2(10)
      LABEL_TEXT:
        sql:
          type: VARCHAR2(500)

# ============================================
# DIRECTORY SCHEMA
